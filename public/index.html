<html>
    <head>

        <title>WiC64meX - Connect</title>
        <link rel="stylesheet" href="/style.css" />
        <script defer src="/index_page.js"></script>
    </head>
    <body>
        <div id="main">

                <img src="/logo.png" alt="WiC64meX Logo" id="logo" />

            <div id="errors"></div>
        </div>
    </body>
</html>
